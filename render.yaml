# Render blueprint (WS9). Creates the API service + Postgres in one step:
# Render dashboard → New → Blueprint → point at this repo.
#
# After the first deploy:
#   1. Set ODDS_API_KEY on the service (dashboard → Environment).
#   2. Copy the generated ADMIN_SECRET into a GitHub Actions repo secret,
#      along with API_URL (the service's public URL) — that activates the
#      scheduled sync workflow.
#   3. Set CORS_ORIGIN to the deployed client origin (e.g. the Vercel URL).
#   4. Seed once from your laptop against the External URL:
#        DATABASE_URL=<external-url> npx prisma migrate deploy   (or let preDeploy do it)
#        DATABASE_URL=<external-url> npm run prisma:seed
services:
  - type: web
    name: pick6-api
    runtime: node
    plan: starter # always-on: required for live draft sockets
    rootDir: server
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pick6-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false # set to the client origin after the client deploys
      - key: ODDS_API_KEY
        sync: false # paste your key in the dashboard

databases:
  - name: pick6-db
    plan: basic-256mb # do NOT use free — free Postgres is deleted after 30 days
