# Render blueprint — single-service deployment (WS9, revised Aug 5).
# One web service runs the Express API *and* serves the built client from the
# same origin — no CORS, no build-time API URLs, one URL to share.
#
# Setup: Render dashboard → New → Blueprint → point at this repo.
# After the first deploy:
#   1. Set ODDS_API_KEY on the service (dashboard → Environment).
#   2. Copy the generated ADMIN_SECRET + the service URL into GitHub Actions
#      repo secrets (ADMIN_SECRET, API_URL) — that activates scheduled syncs.
#   3. Seed once from your laptop against pick6-db's External URL:
#        cd server && DATABASE_URL='<external-url>' npm run prisma:seed
#
# npm note: Render exports NODE_ENV=production, which makes plain `npm ci`
# skip devDependencies. The server keeps everything its build and preDeploy
# need (prisma, typescript) in dependencies, so its install skips dev
# tooling (ESLint); the client build needs vite/typescript from
# devDependencies, so that install uses --include=dev. Node's version comes
# from the root .node-version (CI reads the same file).
services:
  - type: web
    name: pick6
    runtime: node
    plan: starter # always-on: required for live draft sockets
    buildCommand: cd server && npm ci && npx prisma generate && npm run build && cd ../client && npm ci --include=dev && npm run build
    preDeployCommand: cd server && npx prisma migrate deploy
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pick6-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ODDS_API_KEY
        sync: false # paste your key in the dashboard
      - key: RESEND_API_KEY
        sync: false # Resend → API Keys, Sending access for pick6cfb.com; paste in the dashboard
      - key: FAL_KEY
        sync: false # fal.ai → API Keys; the commissioner video messages (pay per use)
      - key: VIDEO_CREATORS
        sync: false # comma-separated login emails who make videos for free (everyone else pays)
      - key: STRIPE_SECRET_KEY
        sync: false # Stripe secret (or restricted: Checkout Sessions write) key; turns on paid videos
      - key: ANTHROPIC_API_KEY
        sync: false # Claude drafts video scripts ("Write it for me")
      # VIDEO_PRICE_CENTS defaults to 350 ($3.50); VIDEO_SCRIPT_MODEL to claude-haiku-5-5
      # EMAIL_FROM / APP_URL default to Pick 6 <noreply@pick6cfb.com> / https://pick6cfb.com
      # CORS_ORIGIN intentionally unset — client and API share one origin

databases:
  - name: pick6-db
    plan: basic-256mb # do NOT use free — free Postgres is deleted after 30 days
