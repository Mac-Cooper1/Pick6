# Scheduled scoring syncs — the cron lives OUTSIDE the app server so a
# server restart/deploy can never silently kill the schedule. Each run hits
# one idempotent endpoint that resolves the current week from the ESPN
# calendar and does games → odds → finalize → rescore for every league.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   API_URL       e.g. https://pick6-api.onrender.com   (no trailing slash)
#   ADMIN_SECRET  same value as the server's ADMIN_SECRET env var
#
# Schedules (UTC; GitHub cron may drift a few minutes):
#   11:00 daily  (~7am ET)  — games + odds land before any kickoff, incl. weeknight MACtion
#   08:30 daily  (~3:30/4:30am ET) — overnight scores for Tue–Sat night finals
#   23:00 Sat    (~6/7pm ET) — mid-slate refresh so Saturday standings move
name: Scheduled sync

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '30 8 * * *'
    - cron: '0 23 * * 6'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync current week (games, odds, finalize, rescore)
        env:
          API_URL: ${{ secrets.API_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$API_URL" ] || [ -z "$ADMIN_SECRET" ]; then
            echo "::error::API_URL / ADMIN_SECRET repo secrets are not set"
            exit 1
          fi
          echo "POST $API_URL/api/admin/sync-current"
          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 30 --retry-all-errors \
            --max-time 300 \
            -X POST "$API_URL/api/admin/sync-current" \
            -H "x-admin-secret: $ADMIN_SECRET"
